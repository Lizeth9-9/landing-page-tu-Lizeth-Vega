<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Vinculación de fuentes tipográficas de Google Fonts para máxima compatibilidad -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playball&amp;family=Montserrat:wght@500;700&amp;display=swap');
      
      .titulo-cursiva {
        font-family: 'Playball', 'Great Vibes', 'Brush Script MT', cursive;
        font-size: 140px;
        fill: #000000; /* Modificable en tu editor */
        text-anchor: middle;
      }
      
      .subtitulo-sans {
        font-family: 'Montserrat', 'Helvetica Neue', 'Arial', sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 7px; /* Estilo expandido característico de logotipos */
        fill: #1A1A1A; /* Modificable en tu editor */
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- El contenedor no tiene fondo, garantizando la transparencia absoluta -->

  <!-- Texto Principal: Cursiva -->
  <text x="500" y="240" class="titulo-cursiva">Enncaanto</text>
  
  <!-- Texto Secundario: Sans-Serif con tracking/espaciado -->
  <text x="500" y="320" class="subtitulo-sans">ENDULZANDO CON PROPÓSITO</text>
</svg>
